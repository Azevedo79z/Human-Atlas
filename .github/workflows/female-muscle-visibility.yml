name: Female muscle visibility validation

on:
  pull_request:
    paths:
      - 'app/anatomy.ts'
      - 'public/models/atlas-female.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/female-muscle-visibility.yml'
  push:
    branches:
      - fix/female-leg-muscles-visible-by-default
    paths:
      - 'app/anatomy.ts'
      - 'public/models/atlas-female.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/female-muscle-visibility.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.13.1'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify female donor muscle manifest
        run: |
          node --input-type=module -e 'import fs from "node:fs"; import assert from "node:assert/strict"; const manifest = JSON.parse(fs.readFileSync("public/models/atlas-female.json", "utf8")); const muscles = manifest.parts.filter(part => part.system === "donor-muscle"); assert.equal(manifest.sex, "female"); assert.equal(muscles.length, 76, "Unexpected donor-muscle part count"); const anatomy = fs.readFileSync("app/anatomy.ts", "utf8"); assert.match(anatomy, /if\\(sex===\\x27female\\x27\\)visible\\.push\\(\\x27donor-muscle\\x27\\)/, "Female default visibility is not enabled"); console.log(`Validated ${muscles.length} female donor muscle parts and default visibility.`);'
      - name: TypeScript check
        run: npm run check
      - name: Production build
        run: npm run build
