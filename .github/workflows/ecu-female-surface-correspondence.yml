name: ECU female surface correspondence audit

on:
  push:
    branches:
      - audit/ecu-female-anchor-inventory
    paths:
      - "scripts/audit-ecu-female-surface-correspondence.mjs"
      - "scripts/borrow-anatomy.mjs"
      - "public/models/atlas.json"
      - "public/models/atlas-female.json"
      - "public/models/*.bin"
      - ".github/workflows/ecu-female-surface-correspondence.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint correspondence audit
        run: deno lint scripts/audit-ecu-female-surface-correspondence.mjs
      - name: Type-check correspondence audit
        run: deno check scripts/audit-ecu-female-surface-correspondence.mjs
      - name: Reconstruct, compare surfaces, and test triangle-pair collisions
        shell: bash
        run: |
          set -euo pipefail
          deno run --allow-read --allow-net=raw.githubusercontent.com scripts/audit-ecu-female-surface-correspondence.mjs | tee ecu-female-surface-correspondence.json
      - name: Upload diagnostic report
        uses: actions/upload-artifact@v4
        with:
          name: ecu-female-surface-and-overlay-diagnostics
          path: |
            ecu-female-surface-correspondence.json
            ecu-overlay/
          if-no-files-found: error
          retention-days: 14
