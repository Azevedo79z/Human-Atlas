name: Female muscle full-bone surface screening

on:
  pull_request:
    paths:
      - "scripts/screen-female-muscle-full-bone-surface.mjs"
      - ".github/workflows/female-muscle-full-bone-surface-screen.yml"
  push:
    branches: ["feat/female-muscle-full-bone-surface-screen"]
    paths:
      - "scripts/screen-female-muscle-full-bone-surface.mjs"
      - ".github/workflows/female-muscle-full-bone-surface-screen.yml"

permissions:
  contents: read

jobs:
  full-bone-surface-screen:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31
        with:
          deno-version: v1.x
      - name: Lint screening script
        run: deno lint scripts/screen-female-muscle-full-bone-surface.mjs
      - name: Type-check screening script
        run: deno check scripts/screen-female-muscle-full-bone-surface.mjs
      - name: Run read-only geometric screening
        run: deno run --allow-net=raw.githubusercontent.com scripts/screen-female-muscle-full-bone-surface.mjs | tee screening-report.json
      - name: Add report to workflow summary
        if: always()
        run: |
          if [ -f screening-report.json ]; then
            echo "## Female muscle / host bone screening report" >> "$GITHUB_STEP_SUMMARY"
            echo "Generated from read-only geometric screening; measurements are approximate and do not prove anatomical attachment." >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`json" >> "$GITHUB_STEP_SUMMARY"
            cat screening-report.json >> "$GITHUB_STEP_SUMMARY"
            echo "\`\`\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Screening report was not generated." >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: Upload screening report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: female-muscle-full-bone-screening-report
          path: screening-report.json
          if-no-files-found: warn
          retention-days: 14
