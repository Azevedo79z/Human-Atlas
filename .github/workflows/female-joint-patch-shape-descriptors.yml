name: Female joint patch shape descriptors
on:
  push:
    branches: [audit/female-joint-patch-shape-descriptors]
    paths: [scripts/audit-female-knee-ankle-endpoint-patches.mjs, .github/workflows/female-joint-patch-shape-descriptors.yml]
  pull_request:
    branches: [audit/female-joint-patch-shape-descriptors]
    paths: [scripts/audit-female-knee-ankle-endpoint-patches.mjs, .github/workflows/female-joint-patch-shape-descriptors.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  shape-descriptors:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint scripts/audit-female-knee-ankle-endpoint-patches.mjs
      - run: deno check scripts/audit-female-knee-ankle-endpoint-patches.mjs
      - name: Build joint patch shape evidence
        run: deno run --allow-net=raw.githubusercontent.com scripts/audit-female-knee-ankle-endpoint-patches.mjs > female-joint-patch-shape-descriptors.json
      - uses: actions/upload-artifact@v4
        with:
          name: female-joint-patch-shape-descriptors
          path: female-joint-patch-shape-descriptors.json
          if-no-files-found: error
          retention-days: 14
