name: Package female atlas muscle chunk

on:
  push:
    branches:
      - feat/female-lower-limb-registration-data
    paths:
      - .github/workflows/female-atlas-muscle-chunk.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Stage female muscle geometry chunk
        run: |
          set -euo pipefail
          mkdir -p "${{ runner.temp }}/female-muscles"
          cp public/models/atlas-female.json "${{ runner.temp }}/female-muscles/"
          cp public/models/female-13.bin "${{ runner.temp }}/female-muscles/"
          sha256sum "${{ runner.temp }}"/female-muscles/* > "${{ runner.temp }}/female-muscles/SHA256SUMS.txt"
      - name: Upload isolated muscle geometry package
        uses: actions/upload-artifact@v4
        with:
          name: female-atlas-muscle-chunk-13
          path: ${{ runner.temp }}/female-muscles/
          if-no-files-found: error
          retention-days: 7
