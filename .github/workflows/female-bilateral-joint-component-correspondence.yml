name: Female bilateral joint component correspondence
on:
  push:
    branches: [audit/female-joint-bilateral-component-correspondence]
    paths: [scripts/audit-female-knee-ankle-endpoint-patches.mjs, .github/workflows/female-bilateral-joint-component-correspondence.yml]
  pull_request:
    branches: [audit/female-joint-bilateral-component-correspondence]
    paths: [scripts/audit-female-knee-ankle-endpoint-patches.mjs, .github/workflows/female-bilateral-joint-component-correspondence.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  bilateral-correspondence:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno lint scripts/audit-female-knee-ankle-endpoint-patches.mjs
      - run: deno check scripts/audit-female-knee-ankle-endpoint-patches.mjs
      - name: Build bilateral component candidates
        run: deno run --allow-net=raw.githubusercontent.com scripts/audit-female-knee-ankle-endpoint-patches.mjs > female-bilateral-joint-component-correspondence.json
      - uses: actions/upload-artifact@v4
        with:
          name: female-bilateral-joint-component-correspondence
          path: female-bilateral-joint-component-correspondence.json
          if-no-files-found: error
          retention-days: 14
