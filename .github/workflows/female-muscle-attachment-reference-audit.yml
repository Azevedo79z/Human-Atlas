name: Female muscle attachment reference audit

on:
  pull_request:
    paths:
      - "scripts/audit-female-muscle-attachment-references.mjs"
      - ".github/workflows/female-muscle-attachment-reference-audit.yml"
      - "public/models/atlas-female.json"
  push:
    branches: ["feat/female-muscle-attachment-reference-audit"]
    paths:
      - "scripts/audit-female-muscle-attachment-references.mjs"
      - ".github/workflows/female-muscle-attachment-reference-audit.yml"
      - "public/models/atlas-female.json"

permissions:
  contents: read

jobs:
  attachment-reference-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Deno
        uses: denoland/setup-deno@61fe2df320078202e33d7d5ad347e7dcfa0e8f31
        with:
          deno-version: v1.x
      - name: Lint audit
        run: deno lint scripts/audit-female-muscle-attachment-references.mjs
      - name: Type-check audit
        run: deno check scripts/audit-female-muscle-attachment-references.mjs
      - name: Run read-only reference audit
        run: deno run --allow-read=public/models/atlas-female.json scripts/audit-female-muscle-attachment-references.mjs
