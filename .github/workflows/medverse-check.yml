name: MEDVERSE foundation check

on:
  pull_request:
    paths:
      - "medverse/**"
      - ".github/workflows/medverse-check.yml"
  push:
    branches:
      - "feat/medverse-foundation"
    paths:
      - "medverse/**"
      - ".github/workflows/medverse-check.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medverse
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
