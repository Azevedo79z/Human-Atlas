name: Female regional surface registration screen

on:
  push:
    branches:
      - audit/female-regional-surface-registration
    paths:
      - "scripts/audit-female-regional-surface-registration.mjs"
      - ".github/workflows/female-regional-surface-registration.yml"
  pull_request:
    branches:
      - audit/female-host-donor-registration
    paths:
      - "scripts/audit-female-regional-surface-registration.mjs"
      - ".github/workflows/female-regional-surface-registration.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  regional-surface-screen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - name: Lint regional screen
        run: deno lint scripts/audit-female-regional-surface-registration.mjs
      - name: Type-check regional screen
        run: deno check scripts/audit-female-regional-surface-registration.mjs
      - name: Compare source-mapped bone surfaces
        run: deno run --allow-net=raw.githubusercontent.com scripts/audit-female-regional-surface-registration.mjs > female-regional-surface-registration.json
      - name: Summarize read-only registration evidence
        run: |
          echo "## Female regional surface registration screen" >> "$GITHUB_STEP_SUMMARY"
          echo "Read-only sampled vertex comparison after region-specific axis-aligned center fits." >> "$GITHUB_STEP_SUMMARY"
          echo '###json-start' >> "$GITHUB_STEP_SUMMARY"
          cat female-regional-surface-registration.json >> "$GITHUB_STEP_SUMMARY"
          echo '###json-end' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: female-regional-surface-registration
          path: female-regional-surface-registration.json
          if-no-files-found: error
          retention-days: 14
